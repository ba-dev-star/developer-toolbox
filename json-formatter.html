<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free online JSON formatter and validator. Beautify, minify and check your JSON instantly in your browser.">
  <title>JSON Formatter and Validator - Developer Toolbox</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"> <meta property="og:type" content="website"> <meta property="og:site_name" content="Developer Toolbox"> <meta property="og:image" content="https://ba-dev-star.github.io/developer-toolbox/og-image.png"> <meta property="og:image:width" content="1200"> <meta property="og:image:height" content="630"> <meta name="twitter:card" content="summary_large_image"> <link rel="icon" href="favicon.svg" type="image/svg+xml"> <meta property="og:type" content="website"> <meta property="og:site_name" content="Developer Toolbox"> <meta property="og:image" content="https://ba-dev-star.github.io/developer-toolbox/og-image.png"> <meta property="og:image:width" content="1200"> <meta property="og:image:height" content="630"> <meta name="twitter:card" content="summary_large_image"> <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tool.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Developer Toolbox</a>
      <nav class="nav">
        <a href="index.html#tools">Tools</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container tool-page">

    <h1>JSON Formatter and Validator</h1>
    <p class="tool-intro">Paste your JSON, then format it, minify it, or check it for errors. Everything runs in your browser.</p>

    <div class="toolbar">
      <button class="btn" id="btn-format">Format</button>
      <button class="btn btn-secondary" id="btn-minify">Minify</button>
      <button class="btn btn-secondary" id="btn-validate">Validate</button>
      <button class="btn btn-secondary" id="btn-copy">Copy result</button>
      <button class="btn btn-secondary" id="btn-example">Load example</button>
      <button class="btn btn-secondary" id="btn-clear">Clear</button>

      <label for="indent">Indent:</label>
      <select id="indent">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </div>

    <div class="status" id="status"></div>

    <div class="tool-grid">
      <div class="field">
        <label for="json-input">Input</label>
        <textarea id="json-input" placeholder='{"name": "example"}' dir="auto" spellcheck="false"></textarea>
      </div>
      <div class="field">
        <label for="json-output">Result</label>
        <textarea id="json-output" readonly dir="auto" spellcheck="false"></textarea>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Developer Toolbox. Free for everyone.</p> <p class="footer-links"><a href="about.html">About</a> <a href="privacy.html">Privacy</a></p>
    </div>
  </footer>

  <script src="json-formatter.js"></script>

</body>
</html>
