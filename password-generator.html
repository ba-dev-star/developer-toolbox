<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free online password generator. Create strong, random and secure passwords instantly in your browser.">
  <title>Password Generator - Developer Toolbox</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"> <link rel="icon" href="favicon.svg" type="image/svg+xml"> <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tool.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Developer Toolbox</a>
      <nav class="nav">
        <a href="index.html#tools">Tools</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container tool-page">

    <h1>Password Generator</h1>
    <p class="tool-intro">Create strong random passwords. They are generated in your browser and never sent anywhere.</p>

    <div class="panel">

      <div class="output-row">
        <input type="text" id="password" class="output-input" readonly dir="auto" spellcheck="false" aria-label="Generated password">
        <button class="btn" id="btn-copy">Copy</button>
      </div>

      <div class="strength" id="strength"></div>
      <div class="status" id="status"></div>

      <div class="control">
        <label for="length">Length: <strong id="length-value">16</strong></label>
        <input type="range" id="length" min="8" max="64" value="16">
      </div>

      <div class="options">
        <label class="option"><input type="checkbox" id="opt-upper" checked> Uppercase (A-Z)</label>
        <label class="option"><input type="checkbox" id="opt-lower" checked> Lowercase (a-z)</label>
        <label class="option"><input type="checkbox" id="opt-numbers" checked> Numbers (0-9)</label>
        <label class="option"><input type="checkbox" id="opt-symbols" checked> Symbols (!@#$)</label>
      </div>

      <button class="btn btn-secondary" id="btn-generate">Generate new password</button>

    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Developer Toolbox. Free for everyone.</p> <p class="footer-links"><a href="about.html">About</a> <a href="privacy.html">Privacy</a></p>
    </div>
  </footer>

  <script src="password-generator.js"></script>

</body>
</html>
