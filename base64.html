<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free online Base64 encoder and decoder. Convert text to Base64 and back, with full Unicode support.">
  <title>Base64 Encoder and Decoder - Developer Toolbox</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"> <link rel="icon" href="favicon.svg" type="image/svg+xml"> <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tool.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Developer Toolbox</a>
      <nav class="nav">
        <a href="index.html#tools">Tools</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container tool-page">

    <h1>Base64 Encoder and Decoder</h1>
    <p class="tool-intro">Convert text to Base64, or decode Base64 back to text. Works with any language, including Arabic.</p>

    <div class="toolbar">
      <button class="btn" id="btn-encode">Encode</button>
      <button class="btn" id="btn-decode">Decode</button>
      <button class="btn btn-secondary" id="btn-swap">Swap</button>
      <button class="btn btn-secondary" id="btn-copy">Copy result</button>
      <button class="btn btn-secondary" id="btn-clear">Clear</button>
    </div>

    <div class="status" id="status"></div>

    <div class="tool-grid">
      <div class="field">
        <label for="b64-input">Input</label>
        <textarea id="b64-input" placeholder="Type or paste text here" dir="auto" spellcheck="false"></textarea>
      </div>
      <div class="field">
        <label for="b64-output">Result</label>
        <textarea id="b64-output" readonly dir="auto" spellcheck="false"></textarea>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Developer Toolbox. Free for everyone.</p> <p class="footer-links"><a href="about.html">About</a> <a href="privacy.html">Privacy</a></p>
    </div>
  </footer>

  <script src="base64.js"></script>

</body>
</html>
